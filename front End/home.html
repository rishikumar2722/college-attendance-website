<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Staff Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="header-logo-left">
            <img src="logo.png" alt="Thanthai Hans Roever College Logo" onerror="this.style.visibility='hidden'">
        </div>
        <div class="header-college-info">
            <p class="header-college-name">THANTHAI HANS ROEVER COLLEGE (AUTONOMOUS)</p>
            <p class="header-college-affiliation">(Affiliated to Bharathidasan University)</p>
            <p class="header-college-accreditation">Accredited with ‘A’Grade by NAAC (3rd cycle) with CGPA 3.23 out of 4</p>
            <p class="header-college-address">ELAMBALUR (P.O), PERAMBALUR – 621 220</p>
            <h2 class="header-system-title">Attendance Maintenance System</h2>
        </div>
        <div class="header-logo-right">
            <img src="img/Hans.png" alt="Thanthai Hans Roever College" onerror="this.style.visibility='hidden'">
        </div>
    </header>
    <main class="main-content">

    <div class="container center" style="padding-top: 50px; padding-bottom: 50px;">
        <h2 id="userInfo" style="color: #ffffff; line-height: 1.6;"></h2>

        <!-- Buttons Row 1 -->
        <div style="margin-top: 25px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
            <button onclick="location.href='attendance.html'" style="font-size: 16px; padding: 12px 28px; min-width: 200px;">Mark Attendance</button>
            <button onclick="location.href='request-student.html'" style="font-size: 16px; padding: 12px 28px; min-width: 200px;">Student Registration Request</button>
        </div>

        <!-- Buttons Row 2 -->
        <div style="margin-top: 15px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
            <button id="btnRequestStatus" onclick="navigateToRegistrationStatus()" style="font-size: 16px; padding: 12px 28px; min-width: 200px;">Request Approval Status</button>
            <!-- Student Data button — shown for all CS staff (Year 1, 2, 3) -->
            <button id="btnStudentData" onclick="location.href='staff-student-data.html'" style="font-size: 16px; padding: 12px 28px; min-width: 200px; display: none;">Student Data</button>
        </div>

        <div style="margin-top: 25px;">
            <button class="red" onclick="logout()" style="padding: 8px 24px;">Logout</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Show Student Data button for all CS staff with a specific year (CS1, CS2, CS3)
        (function showStudentDataBtn() {
            const user = JSON.parse(localStorage.getItem("currentUser") || "null");
            if (user && user.role === "staff" &&
                user.department && user.department.toLowerCase().includes("computer") &&
                ["1","2","3"].includes(String(user.year))) {
                const btn = document.getElementById("btnStudentData");
                if (btn) btn.style.display = "inline-block";
            }
        })();
        // Handler for Student Registration button on Staff Dashboard
        async function handleStaffStudentRegistration() {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = "index.html";
                return;
            }

            // Check if there are approved requests waiting for registration completion
            try {
                const token = localStorage.getItem("token");
                const res = await fetch(`${BASE_URL}/student-requests/my-requests`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    const approvedWaiting = (data.requests || []).filter(r => r.status === 'approved' && !r.isCompleted && !r.completedStudentId);
                    if (approvedWaiting.length > 0) {
                        alert(`You have ${approvedWaiting.length} approved registration request(s) ready to be completed. Redirecting to My Student Registration Requests.`);
                        window.location.href = getRegistrationStatusUrl();
                        return;
                    }
                }
            } catch (e) {}

            // Inform staff that registration requires prior Admin approval
            const proceed = confirm("Student registration requires prior Admin approval.\n\nWould you like to submit a new Student Registration Request to the Admin?");
            if (proceed) {
                window.location.href = "request-student.html";
            } else {
                window.location.href = getRegistrationStatusUrl();
            }
        }

        // ======================================================================

        /**
         * Navigate to the correct registration status page based on UG/PG program
         */
        function navigateToRegistrationStatus() {
            const user = JSON.parse(localStorage.getItem("currentUser") || "null");
            if (!user) { window.location.href = "index.html"; return; }
            if (user.role === "admin") { window.location.href = "admin-student-requests.html"; return; }

            const isPG = (user.program === 'PG') ||
                         (user.classId && user.classId.startsWith('PG')) ||
                         (user.username && user.username.toLowerCase().startsWith('pg'));

            if (isPG) {
                window.location.href = "pg-registration-status.html";
            } else {
                window.location.href = "ug-registration-status.html";
            }
        }

        /**
         * Get the correct registration status URL for this user
         */
        function getRegistrationStatusUrl() {
            const user = JSON.parse(localStorage.getItem("currentUser") || "null");
            if (!user || user.role === "admin") return "admin-student-requests.html";
            const isPG = (user.program === 'PG') ||
                         (user.classId && user.classId.startsWith('PG')) ||
                         (user.username && user.username.toLowerCase().startsWith('pg'));
            return isPG ? "pg-registration-status.html" : "ug-registration-status.html";
        }
    </script>
    </main>
</body>

</html>
