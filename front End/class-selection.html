<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Class - Staff</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="header-logo-left">
            <img src="logo.png" alt="Thanthai Hans Roever College Logo" onerror="this.style.visibility='hidden'">
        </div>
       <div class="header-college-info">
            <p class="header-college-name">THANTHAI HANS ROEVER COLLEGE (AUTONOMOUS)</p>
            <p class="header-college-affiliation">(Affiliated to Bharathidasan University)</p>
            <p class="header-college-accreditation">Accredited with ‘A’Grade by NAAC (3rd cycle) with CGPA 3.23 out of 4</p>
            <p class="header-college-address">ELAMBALUR (P.O), PERAMBALUR – 621 220</p>
            <h2 class="header-system-title">Attendance Maintenance System</h2>
        </div>
        <div class="header-logo-right">
            <img src="img/Hans.png" alt="Thanthai Hans Roever College" onerror="this.style.visibility='hidden'">
        </div>
    </header>
    <main class="main-content">

    <div class="container center" style="padding-top: 60px; padding-bottom: 50px;">
        <h2 id="selectionHeading" style="color: #ffffff; margin-bottom: 8px;">Select Your Class</h2>
        <p id="staffName" style="color: rgba(255, 255, 255, 0.8); margin-bottom: 30px;">Logged in as Staff</p>

        <!-- Dynamic Year Selection Buttons Container -->
        <div id="classButtonsContainer" style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;">
            <!-- Buttons dynamically generated in class-selection.js based on UG vs PG login -->
        </div>

        <div id="selectionMsg" class="center" style="margin-top: 25px; font-weight: 500;"></div>

        <div style="margin-top: 35px;">
            <button class="red" onclick="logout()" style="padding: 8px 24px;">Logout</button>
        </div>
    </div>

    <script src="class-selection.js"></script>
    </main>
</body>

</html>
