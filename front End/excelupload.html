<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Excel Upload</title>

    <link rel="stylesheet" href="style.css">

    <!-- SheetJS for reading Excel files in the browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        .template-link {
            display: inline-block;
            background: #17a2b8;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 5px;
            margin: 10px 0;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .template-link:hover {
            background: #138496;
            transform: translateY(-2px);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="header-logo-left">
            <img src="logo.png" alt="Thanthai Hans Roever College Logo" onerror="this.style.visibility='hidden'">
        </div>
        <div class="header-college-info">
            <p class="header-college-name">Thanthai Hans Roever College (Autonomous)</p>
            <p class="header-college-affiliation">(Affiliated to Bharathidasan University)</p>
            <p class="header-college-accreditation">Accredited with 'A' Grade by NAAC (3rd cycle) with CGPA 3.23 out of 4</p>
            <p class="header-college-address">ELAMBALUR (P.O), PERAMBALUR – 621 220</p>
            <h2 class="header-system-title">Attendance Maintenance System</h2>
        </div>
        <div class="header-logo-right">
            <img src="img/Hans.png" alt="Thanthai Hans Roever College" onerror="this.style.visibility='hidden'">
        </div>
    </header>
    <main class="main-content">

    <div class="container center">

        <h2>Upload Students</h2>
        
        <p style="text-align: center; margin-bottom: 15px;">
            <a href="excel-upload-template.html" class="template-link" target="_blank">
                📋 Download Upload Template (with all column details)
            </a>
        </p>

        <form id="uploadForm">

            <label>Department</label>
            <select id="department" required>
                <option value="" disabled selected>Select Department</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Tamil">Tamil</option>
                <option value="English">English</option>
            </select>

            <label>Program</label>
            <select id="program" onchange="onProgramChange()">
                <option value="UG" selected>UG (Undergraduate)</option>
                <option value="PG">PG (Postgraduate)</option>
            </select>

            <label>Year</label>
            <select id="year" required>
                <option value="" disabled selected>Select Year</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
            </select>

            <label>Select Excel File</label>
            <input type="file" id="file" accept=".xlsx,.xls" required>

            <button type="submit">Upload</button>

        </form>

        <div id="result"></div>

        <br>
        <button class="red" onclick="goBack()">Back</button>

    </div>

    <script>
        const BASE_URL = 'http://localhost:3000/api';

        function goBack() {
            let user = null;
            try {
                user = JSON.parse(localStorage.getItem("currentUser"));
            } catch (e) {}

            if (user && user.role === "admin") {
                window.location.href = "admin.html";
            } else {
                window.location.href = "home.html";
            }
        }

        function onProgramChange() {
            const prog = document.getElementById("program").value;
            const yearSelect = document.getElementById("year");
            const curVal = yearSelect.value;
            yearSelect.innerHTML = '<option value="" disabled selected>Select Year</option>';

            if (prog === 'PG') {
                yearSelect.innerHTML += `
                    <option value="1">1st Year (PGCS1)</option>
                    <option value="2">2nd Year (PGCS2)</option>
                `;
                if (curVal === '1' || curVal === '2') yearSelect.value = curVal;
            } else {
                yearSelect.innerHTML += `
                    <option value="1">1st Year (CS1)</option>
                    <option value="2">2nd Year (CS2)</option>
                    <option value="3">3rd Year (CS3)</option>
                `;
                if (['1', '2', '3'].includes(curVal)) yearSelect.value = curVal;
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            let user = null;
            try {
                user = JSON.parse(localStorage.getItem("currentUser"));
            } catch (e) {}

            if (!user) {
                window.location.href = "index.html";
                return;
            }

            const isAllowed = user.role === "admin" || user.role === "staff";
            if (!isAllowed) {
                alert("Access denied. Only Admin or Staff can upload students.");
                window.location.href = "home.html";
            }

            // Lock department, program and year dropdowns to the staff's assigned class
            if (user.role === "staff") {
                const deptSelect = document.getElementById("department");
                const progSelect = document.getElementById("program");
                const yearSelect = document.getElementById("year");

                const staffProg = user.program || (user.classId && user.classId.startsWith('PG') ? 'PG' : 'UG');

                if (user.department) {
                    deptSelect.value = user.department;
                    deptSelect.disabled = true;
                }
                if (progSelect) {
                    progSelect.value = staffProg;
                    progSelect.disabled = true;
                }
                onProgramChange();
                if (user.year && ['1', '2', '3'].includes(String(user.year))) {
                    yearSelect.value = String(user.year);
                    yearSelect.disabled = true;
                }
            } else {
                onProgramChange();
            }
        });

        // Submit handler – send Excel to server
document.getElementById("uploadForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    const department = document.getElementById("department").value;
    const program = document.getElementById("program").value;
    const year = document.getElementById("year").value;
    const fileInput = document.getElementById("file");
    const token = localStorage.getItem("token");

    if (!department || !year) {
        document.getElementById("result").innerHTML = "<span style='color:red'>Please select Department, Program and Year.</span>";
        return;
    }
    if (!fileInput.files[0]) {
        document.getElementById("result").innerHTML = "<span style='color:red'>Please select an Excel file.</span>";
        return;
    }
    if (!token) {
        document.getElementById("result").innerHTML = "<span style='color:red'>Not authorized. Please login again.</span>";
        window.location.href = "index.html";
        return;
    }

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);
    formData.append('department', department);
    formData.append('program', program);
    formData.append('year', year);

    try {
        const response = await fetch(`${BASE_URL}/students/upload`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`
            },
            body: formData,
        });
        const result = await response.json();
        if (result.success) {
            document.getElementById("result").innerHTML = `<span style='color:green'>${result.message}. Students added: ${result.stats.insertedStudents}, updated: ${result.stats.updatedStudents}, attendance records: ${result.stats.insertedAttendance}</span>`;
        } else {
            document.getElementById("result").innerHTML = `<span style='color:red'>Error: ${result.message || 'Upload failed'}</span>`;
        }
    } catch (err) {
        console.error(err);
        document.getElementById("result").innerHTML = "<span style='color:red'>Network error while uploading.</span>";
    }
});


            // NOTE: The client‑side parsing and localStorage handling for Excel uploads has been removed.
            // The upload is now performed via a single POST to the backend endpoint `${BASE_URL}/students/upload`.
            // The server processes the file, updates the database, and returns a summary.
            // This simplifies the UI and ensures data persistence in MongoDB Atlas.

    </script>

    </main>
</body>

</html>
